[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rendervn-ai-engine"
version = "0.1.0"
description = "FastAPI image processing and rendering adapter for RenderVN AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "httpx>=0.27,<1.0",
    "Pillow>=10.4,<12.0",
    "opencv-python-headless>=4.10,<5.0",
    "replicate>=1.0,<2.0",
    "cloudinary>=1.41,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
